<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="8" />
  
  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="3" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="4" />
  
  <!-- Central Pulse Indicator -->
  <circle cx="256" cy="256" r="28" fill="url(#cyan-grad)" filter="url(#glow)" />
  
  <!-- Running Figure / Telemetry Bolt -->
  <path d="M210 160 Q256 120 300 170 T350 250" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M160 270 Q210 230 256 256 T330 350" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  
  <!-- Live Signal Ping Dot -->
  <circle cx="350" cy="160" r="14" fill="#10B981" filter="url(#glow)" />
</svg>
